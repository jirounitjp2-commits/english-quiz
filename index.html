<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f7ff">
    <meta name="description" content="中学1年生向けの英語クイズ。文法・単語・読み方を楽しく学ぼう。">
    <title>English Quiz - 英語クイズ</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="English Quiz ホーム">
          <span class="brand-mark" aria-hidden="true">E</span>
          <span>English <strong>Quiz</strong></span>
        </a>
        <button class="icon-button" id="sound-toggle" type="button" aria-label="音声をオンにする" title="音声設定">
          <span id="sound-icon" aria-hidden="true">🔈</span>
        </button>
      </header>

      <section class="welcome-row" aria-label="学習状況">
        <div>
          <p class="eyebrow">今日も一歩ずつ</p>
          <h1>英語を楽しく学ぼう <span aria-hidden="true">✦</span></h1>
        </div>
        <div class="streak-pill" title="連続学習日数">
          <span aria-hidden="true">🔥</span>
          <span id="streak-count">0</span><small>日</small>
        </div>
      </section>

      <section class="stats-grid" aria-label="学習統計">
        <article class="stat-card accuracy-card">
          <span class="stat-icon" aria-hidden="true">🎯</span>
          <div><p>正答率</p><strong id="accuracy-value">--%</strong></div>
          <span id="answered-count" class="stat-note">0問チャレンジ</span>
        </article>
        <article class="stat-card level-card">
          <span class="stat-icon" aria-hidden="true">⭐</span>
          <div><p>レベル</p><strong id="level-value">Lv.1</strong></div>
          <span id="xp-value" class="stat-note">0 XP</span>
        </article>
      </section>

      <section class="quiz-card" aria-labelledby="section-title">
        <div class="card-heading">
          <div>
            <p class="eyebrow">学習メニュー</p>
            <h2 id="section-title">どのクイズにする？</h2>
          </div>
          <span class="question-count" id="question-count">全10問</span>
        </div>

        <div class="mode-tabs" role="tablist" aria-label="クイズの種類">
          <button class="mode-tab is-active" type="button" role="tab" aria-selected="true" data-mode="grammar">
            <span aria-hidden="true">✍️</span> 文法
          </button>
          <button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="vocabulary">
            <span aria-hidden="true">📖</span> 単語
          </button>
          <button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="review">
            <span aria-hidden="true">🔁</span> 復習 <span class="review-badge" id="review-count">0</span>
          </button>
        </div>

        <div class="quiz-content" id="quiz-content" aria-live="polite">
          <div class="start-panel" id="start-panel">
            <div class="mascot" aria-hidden="true">🦊</div>
            <h3 id="start-title">文法クイズ</h3>
            <p id="start-description">中学1年生の英文法にチャレンジしよう！</p>
            <div class="vocab-modes" id="vocab-modes" hidden>
              <button type="button" class="vocab-mode is-active" data-vocab-mode="meaning">意味</button>
              <button type="button" class="vocab-mode" data-vocab-mode="reading">読み方</button>
              <button type="button" class="vocab-mode" data-vocab-mode="spelling">つづり</button>
              <button type="button" class="vocab-mode" data-vocab-mode="listening">リスニング</button>
            </div>
            <button type="button" class="primary-button" id="start-button">
              クイズをはじめる <span aria-hidden="true">→</span>
            </button>
          </div>

          <div class="question-panel" id="question-panel" hidden>
            <div class="progress-meta">
              <span id="unit-label">文法</span>
              <span id="progress-label">1 / 10</span>
            </div>
            <div class="progress-track" role="progressbar" aria-label="クイズの進捗" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
              <span id="progress-bar"></span>
            </div>
            <div class="question-box">
              <span class="question-kicker" id="question-kicker">QUESTION 01</span>
              <div class="question-line">
                <h3 id="question-text"></h3>
                <button class="speak-button" id="speak-button" type="button" aria-label="問題を読み上げる" hidden>🔊</button>
              </div>
              <p class="question-hint" id="question-hint">正しい答えを選んでね</p>
            </div>
            <div class="choices" id="choices"></div>
            <div class="answer-feedback" id="answer-feedback" role="status" aria-live="assertive" hidden></div>
            <button type="button" class="primary-button next-button" id="next-button" hidden>
              次の問題へ <span aria-hidden="true">→</span>
            </button>
          </div>

          <div class="result-panel" id="result-panel" hidden>
            <div class="result-emoji" id="result-emoji" aria-hidden="true">🎉</div>
            <p class="eyebrow">クイズ終了</p>
            <h3 id="result-title">よくがんばったね！</h3>
            <p class="result-score" id="result-score"></p>
            <p class="result-xp" id="result-xp"></p>
            <button type="button" class="primary-button" id="again-button">もう一度チャレンジ <span aria-hidden="true">↻</span></button>
          </div>
        </div>
      </section>

      <p class="app-message" id="app-message" role="status" aria-live="polite"></p>
      <footer>毎日の学習を応援しています <span aria-hidden="true">🌱</span></footer>
    </main>
  </body>
</html>
